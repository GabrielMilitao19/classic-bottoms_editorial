<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C B*** — Classic Bottoms</title>
  <meta name="description" content="Classic Bottoms — editorial de moda de Gabriel Militão">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HEADER (acompanha a rolagem) ============ -->
  <header class="site-header" id="header">
    <div class="header-left">
      <span>Gabriel Militão</span>
    </div>

    <a class="header-brand" href="#topo" aria-label="C B*** — Classic Bottoms, Editorial">
      C B***
      <small>Classic Bottoms</small>
      <small>Editorial</small>
    </a>

    <div class="header-right">
      <span>RA: 202501000771</span>
    </div>
  </header>

  <main id="topo">

    <!-- ============ 1) BANNER 1 ============ -->
    <section class="banners">
      <figure class="banner banner-1">
        <img src="images/banner-1.jpg" alt="Modelo sentado nas pedras com a enseada e os barcos ao fundo">
      </figure>
    </section>

    <!-- ============ 2) 5 IMAGENS NA HORIZONTAL (troca ao passar o cursor) ============ -->
    <!-- A sub-imagem (img-hover) só aparece enquanto o cursor está sobre a imagem correspondente.
         --pos / --pos-b = enquadramento horizontal (%) da imagem principal / da sub-imagem -->
    <section class="row-five">
      <figure class="swap" style="--pos:49%; --pos-b:51%">
        <img class="img-main"  src="images/look-01-a.jpg" alt="Calça jeans azul clara, camiseta preta e tênis">
        <img class="img-hover" src="images/look-01-b.jpg" alt="" aria-hidden="true">
      </figure>
      <figure class="swap" style="--pos:48%; --pos-b:49%">
        <img class="img-main"  src="images/look-02-a.jpg" alt="Calça jeans escura com pregas, moletom vermelho e tênis branco">
        <img class="img-hover" src="images/look-02-b.jpg" alt="" aria-hidden="true">
      </figure>
      <figure class="swap" style="--pos:49%; --pos-b:50%">
        <img class="img-main"  src="images/look-03-a.jpg" alt="Calça jeans lavada larga, com cinto marrom, modelo descalço">
        <img class="img-hover" src="images/look-03-b.jpg" alt="" aria-hidden="true">
      </figure>
      <figure class="swap" style="--pos:49%; --pos-b:61%">
        <img class="img-main"  src="images/look-04-a.jpg" alt="Bermuda jeans preta com camiseta preta, meia branca e mocassim">
        <img class="img-hover" src="images/look-04-b.jpg" alt="" aria-hidden="true">
      </figure>
      <figure class="swap" style="--pos:48%; --pos-b:48%">
        <img class="img-main"  src="images/look-05-a.jpg" alt="Calça jeans risca de giz com camiseta branca e tênis">
        <img class="img-hover" src="images/look-05-b.jpg" alt="" aria-hidden="true">
      </figure>
    </section>

    <!-- ============ 3) BANNER 2 ============ -->
    <section class="banners">
      <figure class="banner banner-2">
        <img src="images/banner-2.jpg" alt="Modelo em pé sobre as pedras, de calça escura larga, olhando para a câmera">
      </figure>
    </section>

    <!-- ============ 4) 4 PAINÉIS EM GRADE 2x2 ============ -->
    <section class="row-four">
      <figure class="panel" style="--pos:55%; --posy:50%">
        <img src="images/painel-1.jpg" alt="Modelo em pé sobre as pedras, de calça escura com pregas">
      </figure>
      <figure class="panel" style="--pos:52%">
        <img src="images/painel-2.jpg" alt="Modelo na praia, de jeans largo, com o Pão de Açúcar ao fundo">
      </figure>
      <figure class="panel" style="--pos:43%; --posy:50%">
        <img src="images/painel-3.jpg" alt="Retrato do modelo na praia, de jeans, com o Pão de Açúcar ao fundo">
      </figure>
      <figure class="panel" style="--pos:50%; --posy:85%">
        <img src="images/painel-4.jpg" alt="Modelo sobre as pedras, de calça escura, com a marina ao fundo">
      </figure>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-col">
      <span>Gabriel Militão Vilas Boas</span>
      <span>C B*** - Classic Bottoms</span>
      <a href="mailto:gabrielmilitao92@gmail.com">gabrielmilitao92@gmail.com</a>
    </div>
    <div class="footer-col">
      <span>202501000771</span>
      <span>Fotografia básica - 2.2026</span>
      <span>Ângela Pingo</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
